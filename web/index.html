<div class="app"><aside id="side"><div class="logo"><button id="mb">☰</button>📚 SmartLibrary</div><nav id="nv"></nav><button class="exit" id="ex"><span>⏻</span>Exit</button></aside>
<div class="content"><section class="view" id="v0" hidden><div class="wrap"><h2>Search Library</h2><form id="sf"><input id="q" placeholder="Search books, journals, papers… try “suffix arrays” or a typo like “libary”" autocomplete="off"><select id="md"><option value="multi">Smart search (Aho-Corasick)</option><option value="kmp">Exact phrase (KMP)</option><option value="rk">Hash search (Rabin-Karp)</option></select><button>Search</button></form><div class="chips" id="ch"></div><p id="note" class="note"></p><div class="grid" id="res"></div></div></section>
<section class="view" id="v1" hidden></section><section class="view" id="v2" hidden></section><section class="view" id="v3" hidden></section>
<section class="view" id="v4" hidden><div class="wrap"><h2>Algorithm Lab</h2><p class="note">Run every algorithm from the six modules directly on your own inputs.</p><div id="lt"></div><div id="lm"></div></div></section>
<section class="view" id="v7" hidden></section></div></div>
<dialog id="dlg"></dialog><div id="toast"></div>
<script>
// ---- M1 strings
function pf(p){const f=[0];for(let i=1,k=0;i<p.length;i++){while(k&&p[i]!=p[k])k=f[k-1];if(p[i]==p[k])k++;f.push(k)}return f}
function kmp(t,p){const f=pf(p),r=[];for(let i=0,k=0;i<t.length;i++){while(k&&t[i]!=p[k])k=f[k-1];if(t[i]==p[k])k++;if(k==p.length){r.push(i-k+1);k=f[k-1]}}return r}
function zf(s){const n=s.length,z=Array(n).fill(0);for(let i=1,l=0,r=0;i<n;i++){if(i<r)z[i]=Math.min(r-i,z[i-l]);while(i+z[i]<n&&s[z[i]]==s[i+z[i]])z[i]++;if(i+z[i]>r){l=i;r=i+z[i]}}return z}
function rk(t,p){const M=1000000007,B=256,m=p.length;if(m>t.length)return[];let h=0,ph=0,pw=1,r=[];for(let i=0;i<m;i++){ph=(ph*B+p.charCodeAt(i))%M;h=(h*B+t.charCodeAt(i))%M;if(i)pw=pw*B%M}
for(let i=0;i+m<=t.length;i++){if(h==ph&&t.substr(i,m)==p)r.push(i);if(i+m<t.length)h=((h-t.charCodeAt(i)*pw%M+M)*B+t.charCodeAt(i+m))%M}return r}
function ac(t,ws){const g=[{n:{},f:0,o:[]}];ws.forEach(w=>{let s=0;for(const c of w){if(!g[s].n[c]){g.push({n:{},f:0,o:[]});g[s].n[c]=g.length-1}s=g[s].n[c]}g[s].o.push(w)});const q=[...Object.values(g[0].n)];
while(q.length){const u=q.shift();for(const c in g[u].n){const v=g[u].n[c];let f=g[u].f;while(f&&!g[f].n[c])f=g[f].f;const x=g[f].n[c];g[v].f=x!==undefined&&x!=v?x:0;g[v].o=g[v].o.concat(g[g[v].f].o);q.push(v)}}
let s=0,r=[];for(let i=0;i<t.length;i++){const c=t[i];while(s&&!g[s].n[c])s=g[s].f;s=g[s].n[c]||0;g[s].o.forEach(w=>r.push(w+"@"+(i-w.length+1)))}return r}
// ---- M2 suffix
const sa=s=>[...s].map((_,i)=>i).sort((a,b)=>s.slice(a)<s.slice(b)?-1:1);
function kasai(s,a){const n=s.length,rn=[],l=Array(n).fill(0);a.forEach((v,i)=>rn[v]=i);for(let i=0,h=0;i<n;i++){if(rn[i]){const j=a[rn[i]-1];while(s[i+h]&&s[i+h]==s[j+h])h++;l[rn[i]]=h;if(h)h--}else h=0}return l}
// ---- M3 DP
function dl(a,b){const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];for(let j=1;j<=b.length;j++){d[i][j]=i?Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]!=b[j-1])):j;if(i>1&&j>1&&a[i-1]==b[j-2]&&a[i-2]==b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}}return d[a.length][b.length]}
function nw(a,b){const n=a.length,m=b.length,d=[];for(let i=0;i<=n;i++){d[i]=[];for(let j=0;j<=m;j++)d[i][j]=i&&j?Math.max(d[i-1][j-1]+(a[i-1]==b[j-1]?1:-1),d[i-1][j]-1,d[i][j-1]-1):-(i+j)}
let i=n,j=m,x="",y="";while(i||j){if(i&&j&&d[i][j]==d[i-1][j-1]+(a[i-1]==b[j-1]?1:-1)){x=a[--i]+x;y=b[--j]+y}else if(i&&d[i][j]==d[i-1][j]-1){x=a[--i]+x;y="-"+y}else{x="-"+x;y=b[--j]+y}}return`score=${d[n][m]}\n${x}\n${y}`}
function mcm(p){const n=p.length-1,m=[...Array(n)].map(()=>Array(n).fill(0));for(let l=2;l<=n;l++)for(let i=0;i+l<=n;i++){const j=i+l-1;m[i][j]=1e18;for(let k=i;k<j;k++)m[i][j]=Math.min(m[i][j],m[i][k]+m[k+1][j]+p[i]*p[k+1]*p[j+1])}return m[0][n-1]}
function bm(v,c,B){const n=v.length,co=[0],va=[0];let best=0,bmask=0;for(let s=1;s<1<<n;s++){const b=31-Math.clz32(s&-s),p=s&(s-1);co[s]=co[p]+c[b];va[s]=va[p]+v[b];if(co[s]<=B&&va[s]>best){best=va[s];bmask=s}}
return`best value=${best}, cost=${co[bmask]}, docs chosen=[${[...Array(n)].map((_,i)=>bmask>>i&1?i+1:0).filter(Boolean)}]`}
function obst(f){const n=f.length,e=[...Array(n+2)].map(()=>Array(n+2).fill(0)),w=k=>f.slice(k[0]-1,k[1]).reduce((a,b)=>a+b,0);for(let l=1;l<=n;l++)for(let i=1;i+l-1<=n;i++){const j=i+l-1;e[i][j]=1e18;for(let r=i;r<=j;r++)e[i][j]=Math.min(e[i][j],e[i][r-1]+e[r+1][j]+w([i,j]))}return e[1][n]}
// ---- M4 flow
function match(lines){const adj={},mt={};lines.forEach(l=>{const[a,b]=l.split(":");adj[a.trim()]=b.split(",").map(x=>x.trim())});const tr=(u,v)=>{for(const p of adj[u])if(!v.has(p)){v.add(p);if(!mt[p]||tr(mt[p],v)){mt[p]=u;return true}}return false};let c=0;for(const u in adj)if(tr(u,new Set))c++;return`matching size=${c} (= min vertex cover by König)\n`+Object.entries(mt).map(([p,r])=>r+" ↔ "+p).join("\n")}
function ek(lines){const cap={},nb={};lines.forEach(l=>{const[u,v,c]=l.split(/\s+/);cap[u+"|"+v]=(cap[u+"|"+v]||0)+ +c;cap[v+"|"+u]=cap[v+"|"+u]||0;(nb[u]=nb[u]||new Set).add(v);(nb[v]=nb[v]||new Set).add(u)});let fl=0;for(;;){const pr={S:null},q=["S"];while(q.length&&!("T"in pr)){const u=q.shift();for(const v of nb[u]||[])if(!(v in pr)&&cap[u+"|"+v]>0){pr[v]=u;q.push(v)}}if(!("T"in pr))break;let b=1e9,v="T";while(pr[v]){b=Math.min(b,cap[pr[v]+"|"+v]);v=pr[v]}v="T";while(pr[v]){cap[pr[v]+"|"+v]-=b;cap[v+"|"+pr[v]]+=b;v=pr[v]}fl+=b}return"max flow S→T = "+fl}
// ---- M5 NP
function vc(s){const cov=new Set;s.split(",").forEach(e=>{const[a,b]=e.trim().split("-");if(!cov.has(a)&&!cov.has(b)){cov.add(a);cov.add(b)}});return`2-approx cover = {${[...cov]}} (size ${cov.size}, ≤ 2·OPT)`}
function sat(s){const cl=L(s).map(c=>c.split(/\s+/).map(Number)),n=Math.max(...cl.flat().map(Math.abs));for(let m=0;m<1<<n;m++)if(cl.every(c=>c.some(x=>(m>>(Math.abs(x)-1)&1)==(x>0?1:0))))return"SAT: "+[...Array(n)].map((_,i)=>`x${i+1}=${m>>i&1}`).join(" ");return"UNSATISFIABLE"}

function rqs(a){let c=0;const q=x=>{if(x.length<2)return x;const p=x[Math.random()*x.length|0],l=[],e=[],g=[];x.forEach(v=>{c++;v<p?l.push(v):v>p?g.push(v):e.push(v)});return[...q(l),...e,...q(g)]};const r=q(a);return`sorted: ${r}\ncomparisons=${c}`}
function res(n,k){const r=[];for(let i=1;i<=n;i++){if(i<=k)r.push(i);else{const j=Math.random()*i|0;if(j<k)r[j]=i}}return`sample of ${k} from stream 1..${n}: ${r.sort((a,b)=>a-b)}`}
function mr(nStr){const n=BigInt(nStr);if(n<2n)return"composite";const pw=(b,e,m)=>{let r=1n;b%=m;while(e){if(e&1n)r=r*b%m;b=b*b%m;e>>=1n}return r};for(const p of[2n,3n,5n,7n,11n,13n,17n,19n,23n,29n,31n,37n]){if(n==p)return"prime";if(n%p==0n)return"composite"}let d=n-1n,s=0;while(!(d&1n)){d>>=1n;s++}
for(const a of[2n,3n,5n,7n,11n,13n,17n,19n,23n,29n,31n,37n]){let x=pw(a,d,n);if(x==1n||x==n-1n)continue;let ok=0;for(let i=1;i<s;i++){x=x*x%n;if(x==n-1n){ok=1;break}}if(!ok)return`composite (witness ${a})`}return"probably prime"}
function bl(a){let n=1;while(n<a.length)n*=2;const x=[...a,...Array(n-a.length).fill(0)];for(let d=1;d<n;d*=2)for(let i=2*d-1;i<n;i+=2*d)x[i]+=x[i-d];x[n-1]=0;for(let d=n/2;d>=1;d/=2)for(let i=2*d-1;i<n;i+=2*d){const t=x[i-d];x[i-d]=x[i];x[i]+=t}return`exclusive prefix: ${x.slice(0,a.length)}\nrounds: ${2*Math.log2(n)} (work O(n), depth O(log n))`}
function pr(a,p){const n=a.length,d=Math.ceil(Math.log2(n)),W=n-1;return`sum=${a.reduce((x,y)=>x+y,0)}\nwork W=${W}, depth D=${d}\nBrent: T_p ≤ W/p + D = ${(W/p+d).toFixed(2)} steps on ${p} processors`}

el.innerHTML=`<div class="kp"><div><b>${SH.length}</b><small>total searches</small></div><div><b>${new Set(SH.map(s=>s.q.toLowerCase())).size}</b><small>unique queries</small></div><div><b>${Object.keys(f).length}</b><small>distinct keywords</small></div></div><div class="panel"><h3>Most searched keywords</h3>${e.map(([w,c])=>`<div class="hb"><span>${esc(w)}</span><i style="width:${c/mx*70}%"></i><b>${c}</b></div>`).join("")||'<p class="note">No searches yet – use Search Library first.</p>'}</div><div class="panel"><h3>Optimal search tree</h3><small>Keys (alphabetical) with frequency: ${ks.map(x=>esc(x[0])+"("+x[1]+")").join(", ")||"none"}</small><pre>Minimum expected search cost = ${ks.length?obst(ks.map(x=>x[1])):0}</pre></div>`}],
["Usage activity",el=>{const DY=864e5,t0=new Date().setHours(0,0,0,0),days=[...Array(7)].map((_,j)=>t0-(6-j)*DY),ev=[...SH.map(s=>s.t),...BH.map(x=>x.b)],u=days.map(d=>ev.filter(t=>t>=d&&t<d+DY).length),cu=u.map((_,j)=>u.slice(0,j+1).reduce((a,b)=>a+b)),lb=days.map(d=>new Date(d).toLocaleDateString(undefined,{weekday:"short"})),
bars=a=>{const mx=Math.max(...a,1);return`<div class="bars">${a.map((v,j)=>`<div class="bar"><small>${v}</small><i style="height:${v/mx*80}%"></i><em>${lb[j]}</em></div>`).join("")}</div>`},
sm=SH.length?res(SH.length,Math.min(5,SH.length)).split(": ")[1].split(",").map(n=>esc(SH[+n-1].q)):[];
el.innerHTML=`<div class="two"><div class="panel"><h3>Daily activity</h3><small>searches + borrows, last 7 days</small>${bars(u)}</div><div class="panel"><h3>Cumulative activity</h3><small>Blelloch parallel scan</small>${bars(cu)}</div></div><div class="two"><div class="panel"><h3>Parallel statistics</h3><small>Blelloch scan · Parallel reduce · Brent's theorem</small><pre>${bl(u)}\n\n${pr(u,4)}</pre></div><div class="panel"><h3>Sample of the search stream</h3><small>Reservoir sampling (k ≤ 5)</small><p>${sm.map(q=>`<span class="tag">${q}</span>`).join("")||'<span class="note">No searches yet.</span>'}</p></div></div>`}]],k)}
function cmp(){const A=live(),op=A.map(i=>`<option value="${i}">${ID(i)} · ${D[i].t}</option>`).join("");
pg("Compare Documents",`<div class="panel"><div class="two"><div><label>Document A</label><select id="ca">${op}</select></div><div><label>Document B</label><select id="cb">${op}</select></div></div><button class="btn" id="cg">Compare</button> <small>Needleman-Wunsch alignment · suffix array LCP</small><div id="co"></div></div><div class="panel"><h3>Related documents</h3><p class="note">Documents that share a long common phrase are linked. A 2-approximation vertex cover picks a small set of documents touching every link (Module 5).</p><button class="btn" id="cv">Analyse relationships</button><div id="cr"></div></div>`);
$("#cb").selectedIndex=Math.min(1,A.length-1);
$("#cg").onclick=()=>{const x=D[+$("#ca").value].ab.toLowerCase(),y=D[+$("#cb").value].ab.toLowerCase(),[n,ph]=cp(x,y);$("#co").innerHTML=`<pre>${esc(nw(x,y))}</pre><p>Longest shared phrase: <mark>${esc(ph)||"none"}</mark> (${n} characters)</p>`};
$("#cv").onclick=()=>{const B=A.slice(0,40),e=[];B.forEach((p,u)=>B.slice(u+1).forEach(q=>{if(cp(D[p].ab.toLowerCase(),D[q].ab.toLowerCase())[0]>=18)e.push(p+"-"+q)}));$("#cr").innerHTML=e.length?`<p>${e.length} related pair(s): ${e.map(s=>s.split("-").map(n=>ID(+n)).join(" ↔ ")).join(", ")}</p><pre>${vc(e.join(",")).replace(/\{(.*?)\}/,(m,s)=>"{"+s.split(",").map(n=>ID(+n)).join(", ")+"}")}</pre>`:"<p class='note'>No related pairs found.</p>"}}
function sam(s){const nx=[{}],ln=[0],lk=[-1],cn=[0];let last=0;for(const ch of s){const c=nx.length;nx.push({});ln.push(ln[last]+1);lk.push(0);cn.push(1);let p=last;while(p>=0&&!(ch in nx[p])){nx[p][ch]=c;p=lk[p]}
if(p>=0){const q=nx[p][ch];if(ln[p]+1==ln[q])lk[c]=q;else{const k=nx.length;nx.push({...nx[q]});ln.push(ln[p]+1);lk.push(lk[q]);cn.push(0);while(p>=0&&nx[p][ch]==q){nx[p][ch]=k;p=lk[p]}lk[q]=lk[c]=k}}last=c}
ln.map((_,i)=>i).sort((a,b)=>ln[b]-ln[a]).forEach(v=>{if(lk[v]>0)cn[lk[v]]+=cn[v]});return{nx,cn}}
function samQ(m,p){let v=0;for(const ch of p){if(!(ch in m.nx[v]))return 0;v=m.nx[v][ch]}return m.cn[v]}
function bsr(s,a,p){let lo=0,hi=a.length;while(lo<hi){const m=lo+hi>>1;s.substr(a[m],p.length)<p?lo=m+1:hi=m}const l=lo;hi=a.length;while(lo<hi){const m=lo+hi>>1;s.substr(a[m],p.length)<=p?lo=m+1:hi=m}return a.slice(l,lo)}
function corp(){const A=live(),tx=i=>D[i].t+". "+D[i].ab+".",off=[];let p=0;A.forEach(i=>{off.push(p);p+=tx(i).length+1});return{s:A.map(tx).join("\n").toLowerCase(),off,A}}
const docAt=(c,p)=>{let k=0;while(k+1<c.off.length&&c.off[k+1]<=p)k++;return D[c.A[k]].t};
const sai=el=>{el.innerHTML=`<div class="panel"><p class="note">Indexes every title and abstract in the library as one text (Module 2).</p><button class="btn" id="sb">Build index</button><div id="so"></div></div>`;
$("#sb").onclick=()=>{const c=corp(),t0=performance.now(),a=sa(c.s),l=kasai(c.s,a),ms=(performance.now()-t0).toFixed(1);let m=0,at=0;l.forEach((v,i)=>{if(v>m){m=v;at=a[i]}});
$("#so").innerHTML=`<div class="kp"><div><b>${c.s.length}</b><small>characters</small></div><div><b>${ms} ms</b><small>build time</small></div><div><b>${m}</b><small>longest repeated phrase</small></div></div><p>Longest repeated phrase: <mark>${esc(c.s.substr(at,m).trim())}</mark></p><label>Search a phrase (binary search on the suffix array)</label><input id="sp" placeholder="e.g. suffix arrays"><pre id="sr"></pre>`+tbl(["Rank","Position","LCP","Suffix"],a.slice(0,20).map((p,i)=>[i,p,l[i],esc(c.s.substr(p,40).replace(/\n/g," "))]));
$("#sp").oninput=e=>{const p=e.target.value.toLowerCase();if(!p){$("#sr").textContent="";return}const h=bsr(c.s,a,p);$("#sr").textContent=h.length?h.length+" occurrence(s) in: "+[...new Set(h.map(x=>docAt(c,x)))].join("; "):"Not found"}}}
const samp=el=>{el.innerHTML=`<div class="panel"><p class="note">Builds a suffix automaton over the whole library text and counts substring occurrences.</p><button class="btn" id="mb2">Build automaton</button><div id="mo2"></div></div>`;
$("#mb2").onclick=()=>{const c=corp(),t0=performance.now(),m=sam(c.s),ms=(performance.now()-t0).toFixed(1);
$("#mo2").innerHTML=`<div class="kp"><div><b>${m.nx.length}</b><small>states</small></div><div><b>${c.s.length}</b><small>characters</small></div><div><b>${ms} ms</b><small>build time</small></div></div><label>Substring</label><input id="mq" placeholder="e.g. arrays"><pre id="mr2"></pre>`;
$("#mq").oninput=e=>{const p=e.target.value.toLowerCase();if(!p){$("#mr2").textContent="";return}const n=samQ(m,p);$("#mr2").textContent=n?`Found ${n} time(s) in: `+[...new Set(kmp(c.s,p).map(x=>docAt(c,x)))].join("; "):"Substring not found"}}}

const zt=el=>{el.innerHTML=`<div class="panel"><p class="note">Repeated phrase detection using the Z-function over the library text.</p><input id="zp" placeholder="e.g. library"><pre id="zr"></pre></div>`;$("#zp").oninput=e=>{const p=e.target.value.toLowerCase(),c=corp();if(!p)return $("#zr").textContent="";const z=zf(p+"\x01"+c.s),h=[];z.forEach((v,i)=>{if(i>p.length&&v>=p.length)h.push(i-p.length-1)});$("#zr").textContent=h.length?`Appears ${h.length} time(s) in: `+[...new Set(h.map(x=>docAt(c,x)))].join("; "):"Not found"}};
const tix=(k=0)=>tabs("Text Index",[["Suffix Array & LCP",sai],["Suffix Automaton",samp],["Phrase finder (Z)",zt]],k);

if(a.length){$("#hr").oninput=e=>$("#hv").textContent=e.target.value;$("#go").onclick=()=>{const r=bm(a.map(i=>D[i].r),a.map(i=>D[i].h),+$("#hr").value),ix=r.match(/\[(.*)\]/)[1].split(",").filter(Boolean).map(Number);$("#plan").innerHTML=ix.length?"<h4>Recommended plan</h4>"+ix.map(n=>`<div class="row"><span>${D[a[n-1]].t}</span></div>`).join("")+`<p class="note">${r.split(", docs")[0]}</p>`:"<p class='note'>Nothing fits in that time.</p>"}}}
